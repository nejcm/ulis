name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      # Build before the test step: src/tui/launcher.test.ts asserts that
      # dist/cli.js never pulls in OpenTUI, and it fails when the bundle is
      # missing under CI.
      - name: Build
        run: bun run build

      - name: Node CLI smoke test
        run: node dist/cli.js build --source example

      - name: Test
        run: bun run test

      - name: Verify tui.svg is up to date
        run: |
          bun run gen:screenshot
          git diff --stat -- tui.svg
          test -z "$(git status --porcelain -- tui.svg)"
