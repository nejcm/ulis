name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: "🚀 Build & Publish"
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      !startsWith(github.event.head_commit.message, 'chore(release):'))

    steps:
      - name: "🛎️ Checkout"
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: "🥟 Setup Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: "📦 Install dependencies"
        run: bun install --frozen-lockfile

      - name: "🧹 Lint"
        run: bun run lint

      - name: "🧪 Test"
        run: bun run test

      - name: "🏗️ Build"
        run: bun run build

      - name: "📦 Setup Node for npm"
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          scope: "@nejcm"

      - name: "🔧 Configure Git identity"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: "📤 Publish with np"
        run: bun run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "🔎 Check for new release"
        id: release
        run: |
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "🏷️ Read released version"
        id: package
        if: steps.release.outputs.created == 'true'
        run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: "🔖 Ensure release tag"
        if: steps.release.outputs.created == 'true'
        run: |
          TAG="v${{ steps.package.outputs.version }}"
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: "🎉 Create GitHub Release"
        if: steps.release.outputs.created == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.package.outputs.version }}"
          generate_release_notes: true
